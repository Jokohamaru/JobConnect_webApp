version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jobconnect_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: jobconnect_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: jobconnect_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jobconnect.com
      PGADMIN_DEFAULT_PASSWORD: 123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: